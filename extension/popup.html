<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { width: 320px; background: #09090b; color: #f4f4f5; padding: 16px; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid #27272a; }
    .title { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; color: #10b981; }
    .status-badge { font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 9999px; }
    .status-active { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); }
    .status-paused { background: rgba(245, 158, 11, 0.15); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.3); }
    .card { background: #18181b; border: 1px solid #27272a; border-radius: 8px; padding: 12px; margin-bottom: 12px; font-size: 12px; }
    .card-label { color: #a1a1aa; margin-bottom: 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
    .btn { display: block; width: 100%; padding: 8px 12px; border-radius: 6px; font-size: 12px; font-weight: 500; cursor: pointer; text-align: center; border: none; transition: background 0.15s; }
    .btn-primary { background: #10b981; color: #000; }
    .btn-primary:hover { background: #059669; }
    .btn-secondary { background: #27272a; color: #e4e4e7; margin-top: 8px; text-decoration: none; }
    .btn-secondary:hover { background: #3f3f46; }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; font-size: 12px; }
    .privacy-tag { font-size: 10px; color: #71717a; text-align: center; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21h5v-5"/></svg>
      Continuity AI
    </div>
    <span id="status-badge" class="status-badge status-active">Active</span>
  </div>

  <div class="card">
    <div class="card-label">Current Page Status</div>
    <div id="current-url" style="color: #e4e4e7; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Loading...</div>
    <div id="exclusion-note" style="color: #ef4444; margin-top: 4px; display: none; font-size: 11px;">Protected domain: tracking paused.</div>
  </div>

  <button id="toggle-tracking-btn" class="btn btn-primary">Pause Tracking</button>
  <a href="http://localhost:5173" target="_blank" class="btn btn-secondary">Open Continuity Dashboard</a>

  <div class="privacy-tag">
    Local-first &bull; Passwords & financial portals never recorded
  </div>

  <script src="popup.js"></script>
</body>
</html>
